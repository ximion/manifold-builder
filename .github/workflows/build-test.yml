name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian testing
            image: docker.io/library/debian:testing
            integration: true
          - name: Debian testing (aarch64)
            image: docker.io/library/debian:testing
            runner: ubuntu-26.04-arm
          - name: Debian testing (ASan, UBSan)
            image: docker.io/library/debian:testing
            meson-args: -Db_sanitize=address,undefined
            test-args: --timeout-multiplier 3
          - name: Ubuntu 26.04 LTS
            image: docker.io/library/ubuntu:26.04
          - name: Fedora
            image: docker.io/library/fedora:latest
          - name: Arch Linux
            image: docker.io/library/archlinux:latest

    env:
      BASE_IMAGE: ${{ matrix.image }}
      CI_MESON_ARGS: ${{ matrix.meson-args }}
      CI_TEST_ARGS: ${{ matrix.test-args }}
      CI_INTEGRATION: ${{ matrix.integration }}

    steps:
      - uses: actions/checkout@v7

      # Ubuntu's AppArmor profile for bwrap attaches inside containers too, and
      # takes away all capabilities from what bwrap runs, which the builds need
      - name: Lift AppArmor bwrap restrictions
        run: |
          if sudo grep -qs '^bwrap ' /sys/kernel/security/apparmor/profiles; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Prepare container
        run: |
          sudo podman build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t manifold-builder-ci \
            -f tests/ci/Containerfile tests/ci

      # Privileged, as the default seccomp and AppArmor profiles of a container deny
      # creating user namespaces and mounting. The tests themselves run unprivileged.
      - name: Build and test
        run: |
          sudo podman run --rm --privileged \
            -v "$PWD:/src:Z" -w /src \
            -e CI_MESON_ARGS="$CI_MESON_ARGS" \
            -e CI_TEST_ARGS="$CI_TEST_ARGS" \
            -e CI_INTEGRATION="$CI_INTEGRATION" \
            manifold-builder-ci tests/ci/build-and-test.sh
